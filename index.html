<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习工具箱</title>
<meta name="description" content="给孩子的学习工具箱：英语、数学，一个个学科慢慢装进来。">
<!-- 缓存指纹（蓝队 2026-10-15）：本地 css/js 引用带 ?v=<版本号> 查询串，
     每次发版更换 URL，杜绝浏览器/中间缓存沿用旧文件（含 registry.js，
     否则新学科注册可能对老用户不可见）。发版时与 window.TOOLBOX_VERSION

<link rel="stylesheet" href="assets/css/style.css?v=2026.10.17.13">

<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>🧰 学习工具箱</h1>
      <p class="subtitle">一个学科一个工具，慢慢把箱子装满。</p>

  <main class="container">
    <div id="module-grid" class="card-grid" aria-live="polite"></div>

    <p class="update-row">
      <button id="check-update-btn" class="update-btn" aria-label="检查更新">⟳ 检查更新</button>
      <span id="update-dot" class="update-dot" hidden aria-hidden="true"></span>
      <span id="version-label" class="version-label"></span>
    </p>
    <div id="update-banner" class="update-banner" hidden></div>
    <p><a href="https://github.com/mentos523/learning-toolbox#打赏">☕ 请我喝杯咖啡</a></p>
  </footer>

  <!-- 内嵌版本号：发布时与根目录 version.json 同步更新 -->
  <script>window.TOOLBOX_VERSION = "2026.10.17.13";</script>
  <script src="assets/js/registry.js?v=2026.10.17.13"></script>
  <script src="assets/js/app.js?v=2026.10.17.13"></script>
  <script src="assets/js/update.js?v=2026.10.17.13"></script>
