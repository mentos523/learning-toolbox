<body data-theme="light">
<!-- 深色模式入口：跟随系统 prefers-color-scheme，系统切换时实时响应；
     地理 SVG/CSS 全走 --geog-* 变量，切换主题重绘 canvas。 -->
<script>
(function () {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function apply() { document.body.setAttribute("data-theme", mq.matches ? "dark" : "light"); }
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);
})();
</script>
