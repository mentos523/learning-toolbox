<!-- 深色模式入口：跟随系统 prefers-color-scheme，系统切换时实时响应；
     化学 SVG/CSS 全走 --chm-* 变量（别名 --geo-*），切换主题不重绘画布。 -->
<script>
(function () {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function apply() { document.body.setAttribute("data-theme", mq.matches ? "dark" : "light"); }
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);  // 旧版 Safari
})();
</script>

<!-- 模块级版本自检（蓝队 2026-10-15）：首页的更新检查只在首页生效，
     直达本页（收藏夹/历史记录）的用户走这里。
     - file:// / 断网：fetch 失败即静默返回，零副作用，不碰 localStorage（ltb-* 学习数据不动）。
     - 发现远端 version.json 更新：顶部出现横幅，点按钮即带缓存破坏参数硬重载本页。 -->
<script>
(function () {
  "use strict";
  if (location.protocol === "file:") return;  // 本地文件模式：静默，不检查
  function cmpVer(a, b) {
    var pa = String(a || "0").split("."), pb = String(b || "0").split(".");
    var n = Math.max(pa.length, pb.length), i, d;
    for (i = 0; i < n; i++) {
      d = (parseInt(pa[i], 10) || 0) - (parseInt(pb[i], 10) || 0);
      if (d) return d;
    }
    return 0;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  fetch("../../version.json", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function (j) {
    var remote = j && j.version ? String(j.version) : "";
    var local = window.CHEM_BUILD || "0";
    if (!remote || cmpVer(remote, local) <= 0) return;  // 已是最新或取不到：静默
    var bar = document.createElement("div");
    bar.id = "chem-update-banner";
    bar.setAttribute("role", "alert");
    bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;" +
      "background:#fff8e1;color:#5d4037;font-size:14px;line-height:1.6;" +
      "padding:10px 16px;text-align:center;border-bottom:2px solid #ffb300;" +
      "box-shadow:0 2px 8px rgba(0,0,0,.15);";
    bar.innerHTML = "🎉 化学模块发现新版本 <b>v" + esc(remote) + "</b>（当前 v" + esc(local) + "），" +
      "点此加载最新文件（学习进度不受影响）：" +
      "<button id=\"chem-update-go\" style=\"margin-left:8px;padding:4px 14px;cursor:pointer;" +
      "background:#0072B2;color:#fff;border:none;border-radius:4px;font-size:14px;\">立即更新</button>";
    document.body.insertBefore(bar, document.body.firstChild);
    document.getElementById("chem-update-go").addEventListener("click", function () {
      // 带缓存破坏参数硬重载：新 HTML 引用新 ?v= 指纹，旧模块文件不可能被沿用
      var u = location.pathname + (location.search ? location.search + "&" : "?") +
        "ub=" + Date.now() + location.hash;
      location.href = u;
    });
  }).catch(function () { /* 断网等：静默 */ });
})();
</script>
