<body data-theme="light">
<!-- （蓝队 2026-10-11 白队 g00 终查问题 3）深色模式入口：跟随系统
     prefers-color-scheme，系统切换时实时响应；几何 SVG 用 CSS 变量
     取色，切换主题不重绘画布。无按钮（header 在 390px 下已拥挤）。 -->
<script>
(function () {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function apply() { document.body.setAttribute("data-theme", mq.matches ? "dark" : "light"); }
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);  // 旧版 Safari
})();
</script>
