<script>
// 接入缝 · 注册表捕获式薄包装（详见 README §接入缝）：
// 分支交互文件只要求“存在 window.MATH_INTERACTIONS.register”即可注册，
// 但旧站 math.js 的注册表没有 getter、且其页面流程（renderPageInner /
// openLesson）是 IIFE 私有函数、无法从外部调用；同时 math.js 的 SPA
// init 会接管 hash（showTracks 时 replaceState 清空 hash），与 Vue 路由冲突。
// 因此试点不加载 math.js 的 SPA init，改为在此先立一个同接口的注册表：
// 注册时既记入试点自己的 PILOT_IX 表（供 app.js 挂载时调用原函数），
// 也转发给此前已存在的注册表（若未来某批先加载了 math.js，仍不丢注册）。
// 这 10 行是试点唯一的“包装”代码；交互实现本身一律是分支原文件。
window.PILOT_IX = window.PILOT_IX || {};
(function () {
  var prev = window.MATH_INTERACTIONS;
  window.MATH_INTERACTIONS = {
    register: function (type, fn) {
      window.PILOT_IX[type] = fn;
      if (prev && typeof prev.register === "function") prev.register(type, fn);
    },
    types: function () { return Object.keys(window.PILOT_IX); }
  };
})();
</script>
