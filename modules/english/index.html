<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 旧 favicon 备查（UI 统一批 2026-10-18 冻结，不再引用）：<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif'%3EAa%3C/text%3E%3C/svg%3E"> -->
<link rel="icon" href="../../assets/img/logo-32.png?v=2026.10.18.8" type="image/png">
<title>英语 · 选择子卡 — 学习工具箱</title>
<meta name="description" content="拨一拨词根，单词自己长出来。">
<link rel="stylesheet" href="../../assets/css/style.css?v=2026.10.19.14">
<link rel="stylesheet" href="css/english.css">
<link rel="stylesheet" href="css/grammar.css">
</head>
<body data-theme="light" data-font="sys" data-size="normal">

<!-- TB:brand-head -->
<div class="tb-brand-head">
  <img class="tb-brand-logo" src="../../assets/img/logo-64.png?v=2026.10.18.8" width="32" height="32" alt="学习工具箱">
  <span class="tb-brand-name">学习工具箱</span>
  <span class="tb-brand-sep" aria-hidden="true">·</span>
  <span class="tb-brand-subject">英语</span>
</div>
<!-- /TB:brand-head -->

<!-- 子卡选择（蓝队 2026-10-14）：讲词根 / 语法双卡片，无深链接时先到这里；
     设计语言复用数学板块卡（m-track-*），取色走本模块 CSS 变量 -->
<section class="e-tracks" id="tracks" aria-label="选择子卡">
  <div class="e-tracks-inner">
    <h2 class="e-tracks-title">英语 · 选择子卡</h2>
    <p class="e-tracks-sub">先选一块，慢慢学。</p>
    <div class="e-track-grid" id="track-grid"></div>
    <p class="e-tracks-foot"><a class="tb-back" href="../../index.html">← 返回工具箱首页</a></p>
  </div>
</section>

<!-- 语法章节浏览器（蓝队 2026-10-15）：20 章/125 课已上线，
     #grammar-browser 由 js/english.js 从 window.ENG_CH 动态生成
     （章列表 → 课列表 → window.ENG_GRAMMAR.open），替换原筹备中外壳 -->
<section class="e-grammar" id="grammar" hidden aria-label="语法">
  <div class="e-grammar-inner">
    <header class="e-grammar-head">
      <a class="tb-back" href="../../index.html" aria-label="返回工具箱首页">← 返回</a>
      <button class="tb-back" data-card-back aria-label="返回子卡选择">子卡</button>
      <h1>英语 · 语法</h1>
    </header>
    <div class="e-grammar-body">
      <div id="grammar-browser"></div>
    </div>
  </div>
</section>

<!-- 语法 SPA 学习页（蓝队 2026-10-15）：从章节浏览器点课进入，或
     #card=grammar&test=<课号> 直达；课内"← 返回" dispatch eng-grammar-exit，
     由 js/english.js 回到章节浏览器。引擎见 js/grammar.js，
     数据见 data/grNN.js（gr00–gr19），样式见 css/grammar.css（g- 前缀，与数学/讲词根隔离）。 -->
<section class="e-grammar-app" id="grammar-app" hidden aria-label="语法学习">
  <div class="g-app" id="g-app"></div>
</section>

<div class="app" id="app" hidden>
  <!-- 左：词根选择（桌面贴边窄条悬停滑出 / 手机顶部栏点开展开） -->
  <aside class="drawer drawer-left" id="drawer-left" aria-label="词根选择">
    <button class="edge-tab" id="tab-left" aria-expanded="false" aria-controls="panel-left">
      <span class="edge-tab-text">词根选择</span>
      <span class="edge-tab-cur" id="tab-left-cur"></span>
    </button>
    <div class="drawer-panel" id="panel-left">
      <div class="drawer-scroll">
      <div class="drawer-head">
        <h2>词根选择</h2>
        <span class="drawer-sub" id="drawer-roots-sub"></span>
      </div>
      <input id="root-search" class="root-search" type="search"
             placeholder="搜索或输入词根，回车选中" autocomplete="off" aria-label="搜索词根">
      <ul class="root-list" id="root-list"></ul>
      <div class="drawer-foot" id="stats"></div>
      </div>
    </div>
  </aside>

  <!-- 中：学习区（一屏，无滚动，无卡片） -->
  <main class="stage-flat">
    <header class="stage-head">
      <a class="back-btn" href="../../index.html" aria-label="返回工具箱首页">← 返回</a>
      <button class="back-btn" data-card-back aria-label="返回子卡选择">子卡</button>
      <h1>词根词缀学习工具</h1>
      <div class="head-tts">
        <button class="tts-btn" id="tts-us">🔊 美音</button>
        <button class="tts-btn" id="tts-gb">🔊 英音</button>
        <span class="tts-rate"><b id="tts-rate">0.9x</b></span>
      </div>
    </header>

    <!-- 焦点：整个单词 + 单词意思 -->
    <div class="word-hero">
      <div class="word-hero-phon" id="hero-phon" aria-label="音标"></div>
      <div class="word-hero-word" id="hero-word" aria-live="polite"></div>
      <div class="word-hero-mean" id="hero-mean"></div>
      <div class="word-hero-parts" id="hero-parts" aria-label="词义分解"></div>
    </div>

    <!-- 新手引导（R-E4 2026-10-15 自学审计整改）：拨盘操作可见提示 -->
    <div class="dial-guide" role="note">🖐 上下拨动：左盘切换词根，右盘切换单词</div>

    <!-- 双拨盘：一排并列（选择器） -->
    <div class="dials">
      <div class="dial">
        <div class="wheel-wrap" id="root-wheel-wrap">
          <div class="wheel" role="listbox" aria-label="词根"></div>
          <div class="wheel-center"></div>
        </div>
        <div class="dial-mean" id="root-mean"></div>
      </div>
      <div class="dial">
        <div class="wheel-wrap" id="word-wheel-wrap">
          <div class="wheel" role="listbox" aria-label="单词"></div>
          <div class="wheel-center"></div>
        </div>
        <div class="dial-mean" id="word-mean"></div>
      </div>
    </div>
  </main>

  <!-- 右：设置（桌面贴边窄条悬停滑出 / 手机底部栏点开展开） -->
  <aside class="drawer drawer-right" id="drawer-right" aria-label="设置">
    <button class="edge-tab" id="tab-right" aria-expanded="false" aria-controls="panel-right">
      <span class="edge-tab-text">设置</span>
      <span class="edge-tab-cur" id="tab-right-cur"></span>
    </button>
    <div class="drawer-panel" id="panel-right">
      <div class="drawer-scroll">
      <div class="drawer-head">
        <h2>设置</h2>
        <span class="drawer-sub" id="drawer-settings-sub"></span>
      </div>
      <div class="set-group">
        <h3>背景亮度</h3>
        <div class="seg">
          <button data-set="theme" data-val="light">明亮</button>
          <button data-set="theme" data-val="soft">护眼</button>
          <button data-set="theme" data-val="dark">暗夜</button>
        </div>
      </div>
      <div class="set-group">
        <h3>字体</h3>
        <div class="seg">
          <button data-set="font" data-val="sys">默认</button>
          <button data-set="font" data-val="serif">衬线</button>
          <button data-set="font" data-val="round">圆润</button>
        </div>
      </div>
      <div class="set-group">
        <h3>字号</h3>
        <div class="seg">
          <button data-set="size" data-val="normal">标准</button>
          <button data-set="size" data-val="large">大</button>
        </div>
      </div>
      <div class="set-group">
        <h3>语音模式</h3>
        <div class="seg">
          <button data-set="voice" data-val="us">美音</button>
          <button data-set="voice" data-val="gb">英音</button>
        </div>
        <div class="set-row">
          <span>语速</span>
          <input type="range" id="set-rate" min="0.5" max="1.5" step="0.1" value="0.9">
          <span class="set-val" id="set-rate-val">0.9x</span>
        </div>
        <div class="set-row">
          <span>切换单词自动朗读</span>
          <label class="switch" style="margin-left:auto;">
            <input type="checkbox" id="set-auto">
            <span class="sl"></span>
          </label>
        </div>
      </div>
      <div class="set-group">
        <h3>关于</h3>
        <p style="font-size:0.85rem;color:var(--ink-soft);margin:0;">
          设置保存在本机浏览器中。<br>
          发音为浏览器合成语音（美音/英音），离线可用。
        </p>
      </div>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status"></div>

<!-- TB:footer -->
<div class="tb-footer tb-footer-fixed">学习工具箱 · 英语 · 版本 2026.10.18.8</div>
<!-- /TB:footer -->

</body>
</html>
