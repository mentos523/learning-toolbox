<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif'%3EAa%3C/text%3E%3C/svg%3E">
<title>词根词缀学习工具 — 学习工具箱</title>
<meta name="description" content="拨一拨词根，单词自己长出来。">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="css/english.css">
</head>
<body data-theme="light" data-font="sys" data-size="normal">

<div class="page" id="app">
  <!-- 顶栏：返回 + 标题 -->
  <header class="page-head">
    <a class="back-btn" href="../../index.html" aria-label="返回工具箱首页">← 返回</a>
    <h1>词根词缀学习工具</h1>
  </header>

  <!-- 词根选择（默认收起） -->
  <section class="coll" id="coll-roots">
    <button class="coll-head" id="coll-roots-head" aria-expanded="false" aria-controls="coll-roots-body">
      <span class="coll-title">词根选择</span>
      <span class="coll-sub" id="coll-roots-sub"></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="coll-body" id="coll-roots-body">
      <div class="coll-inner">
        <input id="root-search" class="root-search" type="search"
               placeholder="搜索或输入词根，回车选中" autocomplete="off" aria-label="搜索词根">
        <ul class="root-list" id="root-list"></ul>
        <div class="list-foot" id="stats"></div>
      </div>
    </div>
  </section>

  <!-- 学习区（常开） -->
  <main class="stage">
    <div class="version-note">
      v1.1 · <span id="stats2"></span>，词根求精不求多（常见词根 + 初中常见成词）
    </div>

    <!-- 词根区 -->
    <section class="zone" aria-label="词根">
      <h2 class="zone-title">词根 · 拨盘选择字母变形</h2>
      <div class="wheel-wrap" id="variant-wheel-wrap">
        <div class="wheel" role="listbox" aria-label="词根变形"></div>
        <div class="wheel-center"></div>
      </div>
      <div class="mean-cols" id="mean-cols"></div>
    </section>

    <!-- 单词区 -->
    <section class="zone" aria-label="单词">
      <h2 class="zone-title">单词 · 拨盘浏览组合词</h2>
      <div class="combo-zh" id="combo-zh"></div>
      <div class="wheel-wrap" id="word-wheel-wrap">
        <div class="wheel" role="listbox" aria-label="单词"></div>
        <div class="wheel-center"></div>
      </div>
      <div class="word-meta" id="word-meta"></div>
      <div class="mapping" id="mapping"></div>
    </section>

    <!-- 朗读区 -->
    <section class="zone" aria-label="朗读">
      <h2 class="zone-title">朗读 · 真人发音</h2>
      <div class="tts-row">
        <button class="tts-btn" id="tts-us">🔊 美音</button>
        <button class="tts-btn" id="tts-gb">🔊 英音</button>
        <span class="tts-rate">语速 <b id="tts-rate">0.9x</b></span>
      </div>
      <p class="tts-note" id="tts-note">默认美音 · 语速可在下方设置中调整</p>
    </section>
  </main>

  <!-- 设置（默认收起） -->
  <section class="coll" id="coll-settings">
    <button class="coll-head" id="coll-settings-head" aria-expanded="false" aria-controls="coll-settings-body">
      <span class="coll-title">设置</span>
      <span class="coll-sub" id="coll-settings-sub"></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="coll-body" id="coll-settings-body">
      <div class="coll-inner">
        <div class="set-group">
          <h3>背景亮度</h3>
          <div class="seg">
            <button data-set="theme" data-val="light">明亮</button>
            <button data-set="theme" data-val="soft">护眼</button>
            <button data-set="theme" data-val="dark">暗夜</button>
          </div>
        </div>
        <div class="set-group">
          <h3>字体</h3>
          <div class="seg">
            <button data-set="font" data-val="sys">默认</button>
            <button data-set="font" data-val="serif">衬线</button>
            <button data-set="font" data-val="round">圆润</button>
          </div>
        </div>
        <div class="set-group">
          <h3>字号</h3>
          <div class="seg">
            <button data-set="size" data-val="normal">标准</button>
            <button data-set="size" data-val="large">大</button>
          </div>
        </div>
        <div class="set-group">
          <h3>语音模式</h3>
          <div class="seg">
            <button data-set="voice" data-val="us">美音</button>
            <button data-set="voice" data-val="gb">英音</button>
          </div>
          <div class="set-row">
            <span>语速</span>
            <input type="range" id="set-rate" min="0.5" max="1.5" step="0.1" value="0.9">
            <span class="set-val" id="set-rate-val">0.9x</span>
          </div>
          <div class="set-row">
            <span>切换单词自动朗读</span>
            <label class="switch" style="margin-left:auto;">
              <input type="checkbox" id="set-auto">
              <span class="sl"></span>
            </label>
          </div>
        </div>
        <div class="set-group">
          <h3>关于</h3>
          <p style="font-size:0.85rem;color:var(--ink-soft);margin:0;">
            设置保存在本机浏览器中。<br>
            发音为本地真人声音频（美音/英音），离线可用。
          </p>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="data/roots.js"></script>
<script src="js/english.js"></script>
</body>
</html>
