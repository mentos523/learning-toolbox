<!-- 深色模式入口：跟随系统 prefers-color-scheme，系统切换时实时响应；
     生物 SVG/CSS 全走 --bio-* 变量（别名 --geo-*），切换主题不重绘 DOM；
     Konva 画布由 BIO_ENGINE 监听 bio-theme 事件重绘。 -->
<script>
(function () {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function apply() {
    var theme = mq.matches ? "dark" : "light";
    document.body.setAttribute("data-theme", theme);
    try { document.dispatchEvent(new CustomEvent("bio-theme", { detail: theme })); } catch (e) {}
  }
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);  // 旧版 Safari
})();
</script>
